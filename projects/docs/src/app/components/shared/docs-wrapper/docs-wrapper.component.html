<div class="relative flex h-full w-full">
  <!-- Main Content -->
  <div class="no-scrollbar h-full flex-1 overflow-auto scroll-smooth">
    <article class="mx-auto max-w-4xl px-4 py-8 font-sans leading-relaxed md:px-6 md:py-12">
      <!-- Mobile TOC Toggle -->
      @if (isMobile$ | async) {
        <div class="mb-8 rounded-lg border bg-muted/30 p-4 lg:hidden">
          <tolle-button
            (click)="toggleToc()"
            variant="ghost"
            size="sm"
            class="flex w-full items-center justify-between text-sm font-semibold">
            <span>On this page</span>
            <i [class]="tocOpen ? 'ri-arrow-up-s-line' : 'ri-arrow-down-s-line'"></i>
          </tolle-button>

          @if (tocOpen) {
            <div class="mt-4 duration-200 animate-in fade-in slide-in-from-top-2">
              @if (tocTemplate) {
                <ng-container *ngTemplateOutlet="tocTemplate"></ng-container>
              } @else {
                <ng-content select="[toc]"></ng-content>
              }
            </div>
          }
        </div>
      }

      <ng-content select="[content]"></ng-content>
    </article>
  </div>

  <!-- Desktop TOC -->
  @if (!(isMobile$ | async)) {
    <aside
      class="no-scrollbar sticky top-0 max-h-screen min-w-56 overflow-y-auto border-l border-border px-8 py-6 xl:block">
      <div class="sticky top-0 z-10 pb-4">
        <p class="text-sm font-semibold text-foreground">On this page</p>
      </div>
      @if (tocTemplate) {
        <ng-container *ngTemplateOutlet="tocTemplate"></ng-container>
      } @else {
        <ng-content select="[toc]"></ng-content>
      }
    </aside>
  }
</div>
